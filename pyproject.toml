[build-system]
requires = ["setuptools>=72.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ifg26"
version = "0.1.0"
description = "IFG-26: Molecular Glue Benchmark — Reproducible Research Repository"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "YOUR NAME", email = "your@email.com" },
]
keywords = ["molecular-glue", "machine-learning", "drug-discovery", "benchmark", "cheminformatics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "rdkit>=2024.09.0",
    "torch>=2.3.0",
    "xgboost>=2.0.3",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "requests>=2.32.0",
    "tqdm>=4.66.0",
    "rapidfuzz>=3.9.0",
    "mlflow>=2.14.0",
    "matplotlib>=3.9.0",
    "datamol>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "black>=24.4.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
notebook = [
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0",
    "seaborn>=0.13.0",
    "plotly>=5.22.0",
]
docs = [
    "sphinx>=7.3.0",
    "myst-parser>=3.0.0",
]

[project.urls]
Repository = "https://github.com/YOUR_ORG/ifg26"
Issues = "https://github.com/YOUR_ORG/ifg26/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ifg26*"]

# ---------------------------------------------------------------------------
# Tool: ruff (linter + formatter)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

# ---------------------------------------------------------------------------
# Tool: black
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]

# ---------------------------------------------------------------------------
# Tool: mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false

# ---------------------------------------------------------------------------
# Tool: pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
